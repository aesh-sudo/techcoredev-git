# "База данных" — настоящий Postgres с меткой app=db
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: secret
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: db-svc
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
# Легальный клиент: busybox с меткой app=api (sleep, чтобы жить и ждать exec)
apiVersion: v1
kind: Pod
metadata:
  name: api
  labels:
    app: api
spec:
  containers:
    - name: box
      image: busybox:1.36
      command: ["sleep", "3600"]
---
# Злодей: busybox с меткой app=hacker
apiVersion: v1
kind: Pod
metadata:
  name: hacker-pod
  labels:
    app: hacker
spec:
  containers:
    - name: box
      image: busybox:1.36
      command: ["sleep", "3600"]
